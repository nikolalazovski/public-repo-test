<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .calculator {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      width: 620px;
      overflow: hidden;
    }
    .display {
      background: #f5f5f5;
      padding: 20px 16px 8px 16px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .history {
      color: #888;
      font-size: 1rem;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history .result {
      font-weight: bold;
      color: #222;
      font-size: 1.2rem;
    }
    .current {
      color: #222;
      font-size: 1.5rem;
      margin-top: 4px;
      word-break: break-all;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 16px;
    }
    .btn {
      background: #eee;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      padding: 18px 0;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active {
      background: #ddd;
    }
    .btn.orange {
      background: #ff7f4d;
      color: #fff;
      font-weight: bold;
    }
    .btn.wide {
      grid-column: span 2;
    }
    .btn.number {
      background: #b3e0ff;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div style="text-align:center; color:#888; margin-bottom: 8px; font-weight: 500; letter-spacing: 1px; font-size: 1.1rem;">
        Calculator served from node: <br/> 
        $NODE_HOST
      </div>
      <div class="history">
        <span id="history-op"></span>
        <span>=</span>
        <span class="result" id="history-result"></span>
      </div>
      <div class="current" id="current-op"></div>
    </div>
    <div class="buttons">
      <button class="btn" onclick="clearAll()">C</button>
      <button class="btn" onclick="appendChar('(')">(</button>
      <button class="btn" onclick="appendChar(')')">)</button>
      <button class="btn" onclick="appendChar('mod')">mod</button>
      <button class="btn number" onclick="appendChar('7')">7</button>
      <button class="btn number" onclick="appendChar('8')">8</button>
      <button class="btn number" onclick="appendChar('9')">9</button>
      <button class="btn" onclick="appendChar('/')">÷</button>
      <button class="btn number" onclick="appendChar('4')">4</button>
      <button class="btn number" onclick="appendChar('5')">5</button>
      <button class="btn number" onclick="appendChar('6')">6</button>
      <button class="btn" onclick="appendChar('*')">×</button>
      <button class="btn number" onclick="appendChar('1')">1</button>
      <button class="btn number" onclick="appendChar('2')">2</button>
      <button class="btn number" onclick="appendChar('3')">3</button>
      <button class="btn" onclick="appendChar('-')">−</button>
      <button class="btn number" onclick="appendChar('0')">0</button>
      <button class="btn" onclick="appendChar('.')">.</button>
      <button class="btn" onclick="appendChar('%')">%</button>
      <button class="btn" onclick="appendChar('+')">+</button>
      <button class="btn" onclick="appendChar('Math.sqrt(')">√</button>
      <button class="btn" onclick="appendChar('**2')">x²</button>
      <button class="btn orange wide" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    let currentOp = '';
    let historyOp = '';
    let historyResult = '';

    function updateDisplay() {
      document.getElementById('current-op').textContent = currentOp;
      document.getElementById('history-op').textContent = historyOp;
      document.getElementById('history-result').textContent = historyResult;
    }

    function appendChar(char) {
      if (char === 'mod') {
        currentOp += '%';
      } else {
        currentOp += char;
      }
      updateDisplay();
    }

    function clearAll() {
      currentOp = '';
      historyOp = '';
      historyResult = '';
      updateDisplay();
    }

    function calculate() {
      try {
        // Replace unicode division and multiplication for eval
        let expr = currentOp.replace(/÷/g, '/').replace(/×/g, '*');
        // Replace mod with %
        expr = expr.replace(/mod/g, '%');
        // Evaluate
        let result = eval(expr);
        if (typeof result === 'number' && !isNaN(result)) {
          historyOp = currentOp;
          historyResult = result;
          currentOp = '';
        } else {
          historyOp = currentOp;
          historyResult = 'Error';
          currentOp = '';
        }
      } catch {
        historyOp = currentOp;
        historyResult = 'Error';
        currentOp = '';
      }
      updateDisplay();
    }

    // Initialize
    updateDisplay();
  </script>
</body>
</html>
